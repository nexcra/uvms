[package]
name = "uvms-gateway"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Linux RTSP to WebRTC gateway with WebSocket playback"

[features]
default = []
nvidia = ["unreal-nvidia/nvidia"]

[dependencies]
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.21"
sha1 = "0.10"
percent-encoding = "2"
socket2 = "0.6"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webrtc = "=0.14.0"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
unreal-core-port = { path = "ports/unreal-core" }
unreal-rtsp = { path = "ports/unreal-rtsp" }
unreal-mp4 = { path = "ports/unreal-mp4" }
unreal-nvidia = { path = "ports/unreal-nvidia" }
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fdk-aac = "=0.8.0"
opus = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
