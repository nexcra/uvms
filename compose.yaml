services:
  gateway:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - ./config.toml:/etc/uvms/config.toml:ro
      - recordings:/var/lib/uvms/recordings
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 40s
volumes:
  recordings:
