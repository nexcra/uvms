[package]
name = "unreal-rtsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native-evidence-derived RTSP H264 ingest without external processes"

[dependencies]
bytes = "1"
anyhow = "1"
base64 = "0.22"
md5 = "0.7"
percent-encoding = "2"
sha2 = "0.10"
getrandom = "0.2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }
url = "2"
